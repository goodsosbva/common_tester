services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: common_tester
      POSTGRES_USER: common_tester
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U common_tester -d common_tester"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://common_tester:${POSTGRES_PASSWORD}@db:5432/common_tester
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TEST_TARGET_BASE_URL: http://127.0.0.1:8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tester-data:/app/.local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  tester-data:
